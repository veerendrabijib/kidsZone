<!DOCTYPE html>
<html lang="en">

<body class="antialiased">
 <div class="min-h-screen w-full bg-[url('/assets/login-bg/login-bg1.png')]  bg-cover bg-center bg-no-repeat">
  <div
   class="max-w-7xl mx-auto min-h-screen flex flex-col lg:flex-row items-start justify-between pt-2 md:pt-5 px-5 md:px-8 lg:px-10">
   <div class="hidden lg:block w-[25%]"></div>
   <div class="w-full lg:w-[55%] flex flex-col items-center justify-start mt-4 lg:mt-2">

    <!-- 1. HEADING : curved text via SVG (fixed top cut issue + viewBox adjustment) -->
    <div class="relative flex justify-center items-center w-full heading-svg-container my-1">
     <svg class="w-full max-w-[650px] h-auto" viewBox="0 0 650 70" preserveAspectRatio="xMidYMid meet"
      style="overflow: visible;">
      <defs>
       <path id="kidsMoonPath" d="M70,42 Q325,8 580,42" />
      </defs>
      <text fill="#290d8c" font-size="34" font-weight="800" letter-spacing="0.5">
       <textPath href="#kidsMoonPath" startOffset="50%" text-anchor="middle">
        Kidszone Login
       </textPath>
      </text>
     </svg>
    </div>

    <!-- 3. FEATURE CARDS: fully tailwind grid with 4 responsive cards (background white, rounded-lg) -->
    <div class="grid grid-cols-2 sm:grid-cols-4 bg-white rounded-2xl w-full shadow-lg border border-indigo-50">
     <!-- Card 1: Kid-Friendly -->
     <div class="py-1 rounded-xl">
      <div class="flex items-center">
       <img src="/assets/icons/kid-frnd.png" class="w-10 h-10 md:w-10 md:h-10 shrink-0 object-contain"
        alt="Kid Friendly Icon" />
       <div>
        <p class="font-bold text-xs text-[#313185] md:text-sm">
         Kid-Friendly
        </p>
        <p class="text-[9px] md:text-[10px] text-[#4a4a91] leading-tight">
         Bright colors & easy to understand
        </p>
       </div>

      </div>
     </div>
     <!-- Card 2: Safe & Secure -->
     <div class="py-1 rounded-xl">
      <div class="flex items-center">
       <img src="/assets/icons/safe.png" class="w-10 h-10 md:w-10 md:h-10 shrink-0 object-contain"
        alt="Kid Friendly Icon" />
       <div>
        <p class="font-bold text-xs text-[#313185] md:text-sm">Safe & Secure</p>
        <p class="text-[9px] md:text-[10px] text-[#4a4a91] leading-tight">COPPA compliant for
         child safety</p>
       </div>
      </div>
     </div>
     <!-- Card 3: Engaging -->
     <div class="py-1 rounded-xl ">
      <div class="flex items-center">
       <img src="/assets/icons/engage.png" class="w-10 h-10 md:w-10 md:h-10 shrink-0 object-contain"
        alt="Kid Friendly Icon" />

       <div>
        <p class="font-bold text-xs text-[#313185] md:text-sm">Engaging</p>
        <p class="text-[9px] md:text-[10px] text-[#4a4a91] leading-tight">Interactive elements &
         fun animations</p>
       </div>
      </div>
     </div>
     <!-- Card 4: Personalized -->
     <div class="py-1 rounded-xl ">
      <div class="flex items-center">
       <img src="/assets/icons/personal.png" class="w-10 h-10 md:w-10 md:h-10 shrink-0 object-contain"
        alt="Kid Friendly Icon" />
       <div>
        <p class="font-bold text-xs text-[#313185] md:text-sm">Personalized</p>
        <p class="text-[9px] md:text-[10px] text-[#4a4a91] leading-tight">Lets kids feel it is
         their own space</p>
       </div>
      </div>
     </div>
    </div>

    <div class="flex flex-col items-center justify-center my-3">
     <div
      class="relative px-8 py-4 rounded-3xl bg-gradient-to-r from-purple-600 via-pink-500 to-indigo-600 shadow-2xl animate-pulse">
      <span class="text-3xl font-extrabold text-white tracking-wide animate-bounce inline-block">
       Choose Your Friend! 🎉
      </span>
      <div class="absolute -top-3 -left-3 text-yellow-300 text-2xl animate-ping">
       ✨
      </div>
      <div class="absolute -bottom-2 -right-2 text-yellow-300 text-xl animate-bounce">
       ⭐
      </div>
     </div>
    </div>

    <div class="h-fit mt-1 w-full flex items-center gap-4 p-4">
     @for (character of characters; track character.id) {
     <div class="character-card">
      <div class="tick-mark" [class.show]="selectedCharacter?.id === character.id">
       <i class="fa-solid fa-check fa-beat fa-xl" style="color: white;"></i>
      </div>
      <div class="character-sprite" [class.selected]="selectedCharacter?.id === character.id"
       [style.background-image]="'url(' + character.path + ')'" (click)="onChangeRoute(character)"></div>
      <!-- <div class="character-name">{{character.name}}</div> -->
     </div>
     }
    </div>


   </div>
   <div class="hidden lg:flex lg:w-[20%] justify-end mt-8 lg:mt-46 xl:mt-28">
   </div>
  </div>

 </div>
</body>

</html>
