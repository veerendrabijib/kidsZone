<!DOCTYPE html>
<html lang="en">

<body>
    <div class="bg-bubbles">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="kids-home">
        <h3>
            Hi {{name}}, Welcome to
            <span>Kids Zone</span>
        </h3>
        <p>
            🌟 Learn, Play, Imagine and Grow with fun activities,<br>
            colorful games and creative adventures. 🎨🚀
        </p>
        <div class="button-group">
            <button>Start Learning</button>
            <button class="secondary-btn">Explore Games</button>
            <button>Spin & Enjoy</button>
            <button>Slam Book</button>
        </div>
    </div>

    <script>
        const headingElement = document.querySelector('.kids-home h3');
        let currentName = "Lily";

        function updateNameDisplay(newName) {
            const cleanName = newName.trim();
            if (cleanName === "") return;
            currentName = cleanName;
            headingElement.innerHTML = `Hi ${currentName}, Welcome to\n        <span>Kids Zone</span>`;
        }

        // Double click on greeting to change name
        headingElement.addEventListener('dblclick', (e) => {
            e.stopPropagation();
            let userName = prompt("🎈 What's your name, superstar? 🎈", currentName);
            if (userName && userName !== "") {
                updateNameDisplay(userName);
                // Show welcome toast message
                const toastMsg = document.createElement('div');
                toastMsg.innerText = `🌟 Hello ${userName}! Enjoy the magic 🌟`;
                toastMsg.style.position = 'fixed';
                toastMsg.style.bottom = '20px';
                toastMsg.style.left = '50%';
                toastMsg.style.transform = 'translateX(-50%)';
                toastMsg.style.background = '#FFE484';
                toastMsg.style.color = '#3A2800';
                toastMsg.style.padding = '12px 24px';
                toastMsg.style.borderRadius = '60px';
                toastMsg.style.fontWeight = 'bold';
                toastMsg.style.fontSize = '1.2rem';
                toastMsg.style.boxShadow = '0 8px 18px rgba(0,0,0,0.2)';
                toastMsg.style.zIndex = '999';
                toastMsg.style.fontFamily = "inherit";
                toastMsg.style.backdropFilter = 'blur(5px)';
                toastMsg.style.border = '2px solid gold';
                document.body.appendChild(toastMsg);
                setTimeout(() => {
                    toastMsg.style.opacity = '0';
                    toastMsg.style.transition = 'opacity 0.5s';
                    setTimeout(() => toastMsg.remove(), 500);
                }, 1800);
            }
        });

        // Sparkle effect on button clicks
        function createSparkle(x, y) {
            const spark = document.createElement('div');
            spark.classList.add('sparkle-star');
            const size = Math.random() * 10 + 4;
            spark.style.width = size + 'px';
            spark.style.height = size + 'px';
            spark.style.left = x + 'px';
            spark.style.top = y + 'px';
            spark.style.position = 'fixed';
            spark.style.backgroundColor = `hsl(${Math.random() * 360}, 80%, 65%)`;
            spark.style.borderRadius = '50%';
            spark.style.pointerEvents = 'none';
            spark.style.zIndex = '9999';
            spark.style.boxShadow = '0 0 8px gold';
            spark.style.animation = 'twinkle 0.6s ease-out forwards';
            document.body.appendChild(spark);
            setTimeout(() => {
                spark.remove();
            }, 600);
        }

        function burstSparklesAround(event) {
            const rect = event.target.getBoundingClientRect();
            for (let i = 0; i < 12; i++) {
                const offsetX = (Math.random() - 0.5) * rect.width * 0.9;
                const offsetY = (Math.random() - 0.5) * rect.height * 0.9;
                const x = rect.left + rect.width / 2 + offsetX;
                const y = rect.top + rect.height / 2 + offsetY;
                createSparkle(x, y);
            }

            // Button click feedback message
            const buttonText = event.target.innerText;
            const feedback = document.createElement('div');
            feedback.innerText = `🎉 ${buttonText}! 🎉`;
            feedback.style.position = 'fixed';
            feedback.style.top = '50%';
            feedback.style.left = '50%';
            feedback.style.transform = 'translate(-50%, -50%)';
            feedback.style.background = 'rgba(255, 215, 0, 0.95)';
            feedback.style.color = '#2C1810';
            feedback.style.padding = '15px 30px';
            feedback.style.borderRadius = '50px';
            feedback.style.fontWeight = 'bold';
            feedback.style.fontSize = '1.5rem';
            feedback.style.zIndex = '10000';
            feedback.style.pointerEvents = 'none';
            feedback.style.animation = 'fadeOutUp 1s ease forwards';
            feedback.style.fontFamily = 'inherit';
            feedback.style.boxShadow = '0 10px 25px rgba(0,0,0,0.2)';
            document.body.appendChild(feedback);
            setTimeout(() => feedback.remove(), 1000);
        }

        // Add click handlers to all buttons
        const allBtns = document.querySelectorAll('.button-group button');
        allBtns.forEach(btn => {
            btn.addEventListener('click', burstSparklesAround);
        });
    </script>

</body>

</html>
