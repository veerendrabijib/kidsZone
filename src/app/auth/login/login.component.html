<div class="flex">
 <div class="h-fit mt-1 w-full flex items-center gap-4 p-4">
  <div class="character-sprite" [style.background-image]="'url(' + selectedCharacter.path + ')'"></div>
 </div>
 <div class="relative min-h-screen flex items-center justify-center px-5 py-7 bg-gray-100">
  <div class="w-full max-w-md bg-white border rounded-xl p-8 shadow-lg">
   <div class="text-center mb-6">
    <span class="text-5xl block mb-3">🐼</span>
    <h1 class="text-3xl font-bold text-gray-800">
     Hello Cham!
    </h1>
    <p class="mt-2 text-gray-500">
     Ready for some fun? Let's go! 🎉
    </p>
   </div>
   <form [formGroup]="loginForm" (ngSubmit)="onLogin()" novalidate>
    <div class="mb-4">
     <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
      👤 Your Fun Name
     </label>
     <input id="username" type="text" formControlName="username" placeholder="Type your name here..."
      autocomplete="username" aria-describedby="username-error"
      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
     <div *ngIf="username.touched && username.invalid" id="username-error" class="mt-2 text-sm text-red-600"
      role="alert">
      <span *ngIf="username.errors?.['required']">
       😊 Oops! Enter your name!
      </span>
      <span *ngIf="username.errors?.['minlength']">
       🤏 Your name needs at least 3 letters!
      </span>
     </div>
    </div>
    <button type="submit" [disabled]="isLoading"
     class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed">
     <ng-container *ngIf="!isLoading">
      🎮 Let's Play!
     </ng-container>
     <span *ngIf="isLoading">
      Loading...
     </span>
    </button>
    <!-- Divider -->
    <div class="my-5 text-center text-gray-400">
     or
    </div>
    <!-- Signup -->
    <a routerLink="/login/signup"
     class="block w-full text-center bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-3 rounded-lg transition">
     ✨ Create New Account
    </a>
   </form>
   <!-- Bottom Tip -->
   <p class="mt-5 text-center text-sm font-semibold text-cyan-700 bg-cyan-50 rounded-lg px-3 py-2">
    💡 Tip: Ask mum or dad if you need help! 🌈
   </p>
  </div>
 </div>
</div>
