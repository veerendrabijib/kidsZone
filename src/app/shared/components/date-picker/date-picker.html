<div class="grid gap-2 w-full">
  @if (config.label) {
  <div class="flex items-center gap-1 text-sm font-medium text-slate-700">
    {{ config.label }}
    @if (config.required) { <span class="text-rose-500">*</span> }
  </div>
  }

  <div class="grid gap-3 w-full rounded-md border border-slate-300 bg-white p-3">
    @if (!isMultiMode) {
    <div class="relative">
      <input
        class="w-full rounded-md border border-slate-200 bg-slate-50 px-3 py-2 text-sm text-slate-900 outline-none transition duration-150 focus:border-sky-500 focus:ring-2 focus:ring-sky-100 disabled:cursor-not-allowed disabled:bg-slate-100"
        type="date"
        [attr.min]="config.min"
        [attr.max]="config.max"
        [value]="inputValue"
        [disabled]="config.readonly"
        (input)="handleSingleDateChange($event)"
      />
      <span class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-slate-400">📅</span>
    </div>
    } @else {
    <div class="grid gap-3">
      @for (date of multiDates; track date) {
      <div class="flex flex-col gap-2 rounded-md border border-slate-200 bg-slate-50 p-3">
        <input
          class="w-full rounded-md border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 outline-none transition duration-150 focus:border-sky-500 focus:ring-2 focus:ring-sky-100 disabled:cursor-not-allowed disabled:bg-slate-100"
          type="date"
          [attr.min]="config.min"
          [attr.max]="config.max"
          [value]="date"
          [disabled]="config.readonly"
          (input)="handleMultiDateChange(date, $event)"
        />
        @if (!config.readonly) {
        <button
          type="button"
          class="self-start rounded-md border border-slate-300 bg-white px-3 py-1 text-sm text-slate-700 transition hover:bg-slate-100"
          (click)="removeDate(date)"
        >Remove</button>
        }
      </div>
      }
      @if (!config.readonly) {
      <button
        type="button"
        class="inline-flex items-center justify-center rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-700 transition hover:bg-slate-100"
        (click)="addDate()"
      >Add Date</button>
      }
    </div>
    }
  </div>
</div>
