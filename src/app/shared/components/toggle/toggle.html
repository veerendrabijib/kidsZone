<label class="inline-flex items-center cursor-pointer" [class.cursor-not-allowed]="disabled"
 [class.opacity-70]="disabled">
 <input type="checkbox" class="sr-only peer" [checked]="isEnabled" [disabled]="disabled"
  (change)="handleToggle($event)" />
 <span
  class="inline-flex h-7 w-12 rounded-full bg-slate-300 transition-colors duration-150 peer-checked:bg-emerald-500 peer-focus-visible:ring-2 peer-focus-visible:ring-sky-500 peer-disabled:bg-slate-200">
  <span
   class="inline-block h-6 w-6 translate-x-0 rounded-full bg-white shadow-md transition-transform duration-150 peer-checked:translate-x-5"></span>
 </span>
</label>
