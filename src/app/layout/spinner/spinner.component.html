<div class="flex flex-col items-center justify-center min-h-screen bg-sky-200">

 <h1 class="text-5xl font-extrabold text-purple-700 mb-8">
  Kids Animal Spinner
 </h1>

 <div class="relative">
  <!-- Pointer -->
  <div class="absolute left-1/2 -translate-x-1/2 -top-3 z-50
             w-0 h-0 border-l-[20px] border-r-[20px]
             border-t-[40px] border-l-transparent
             border-r-transparent border-t-red-500">

  </div>
  <!-- Wheel -->
  <div class="relative w-[500px] h-[500px] rounded-full border-[12px] border-yellow-400 overflow-hidden shadow-2xl"
   [style.transform]="'rotate(' + rotation + 'deg)'" style="transition: transform 5s cubic-bezier(.17,.67,.12,.99);">
   <ng-container *ngFor="let animal of animals; let i = index">
    <div class="absolute w-1/2 h-1/2 origin-bottom-right" [style.transform]="'rotate(' + (i * 45) + 'deg)'">
     <!-- Slice -->
     <div class="absolute w-full h-full" [style.background]="animal.color"
      style=" clip-path: polygon(0 0, 100% 0, 100% 100%); "></div>
     <!-- Animal -->
     <div class="absolute top-10 left-[55%] flex flex-col items-center"
      [style.transform]="'rotate(' + (-i * 45) + 'deg)'">
      <img [src]="animal.img" [alt]="animal.name" class="w-16 h-16 object-contain" />
      <span class="font-bold text-black mt-2">{{ animal.name }} </span>
     </div>
    </div>
   </ng-container>

   <!-- Center -->
   <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-28 h-28 rounded-full
               bg-yellow-400 border-4 border-white
               flex items-center justify-center">
    ⭐
   </div>

  </div>
 </div>

 <button (click)="spin()" [disabled]="spinning" class="mt-10 px-8 py-4 bg-purple-600 text-white rounded-xl
           font-bold text-xl hover:bg-purple-700 disabled:opacity-50">
  {{ spinning ? 'Spinning...' : 'Spin Wheel' }}
 </button>

 <div *ngIf="selectedAnimal" class="mt-6 text-3xl font-bold">
  Winner: 🐾 {{ selectedAnimal }}
 </div>

</div>
