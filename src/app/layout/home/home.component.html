<!DOCTYPE html>
<html lang="en">

<body>
 <!-- Heading -->
 <div class="min-h-screen w-full bg-no-repeat bg-center"
  style="background-image:url('/assets/login-bg/home-bg.png'); background-size:100% 100%;">
  <div class="flex flex-col items-center justify-center gap-2 text-center">
   @if(gender === 'girl') {
   <p class="mb-3 text-[#290d8c] bg-clip-text text-xl font-semibold mt-2">
    Hi <span class="text-pink-600">{{name}}</span>, CHOOSE YOUR INTEREST
   </p>
   } @else {
   <p class="mb-3 text-[#290d8c] bg-clip-text text-xl font-semibold mt-2">
    Hi <span class="text-blue-700">{{name}}</span>, CHOOSE YOUR INTEREST
   </p>
   }
   <p class="text-[#290d8c] bg-clip-text text-2xl font-bold ">
    What do you love ?
   </p>
   <p class="mb-1 text-[#2703a9] bg-clip-text text-base font-semibold">
    Pick your favorites!
   </p>
  </div>
  <!-- Buttons -->
  <div class="mt-5">
   <div class="flex flex-col items-center gap-2 text-center pt-5">
    <div class="col-span-2 flex flex-wrap gap-10">
     <button
      class="flex flex-col items-center justify-center gap-2 border border-gray-100 text-[#2703a9] font-semibold px-8 py-4 rounded-lg hover:bg-[#6ccef9] transition-all duration-300"
      (click)="onStartLearningClick()">

      <img src="/assets/icons/start_learning.png" class="w-auto h-24 object-contain rounded-xl" alt="Start Learning" />
      <span>Start Learning</span>
     </button>
     <button
      class="flex flex-col items-center justify-center gap-2 border border-gray-100 text-[#2703a9] font-semibold px-8 py-4 rounded-lg hover:bg-[#6ccef9] transition-all duration-300"
      (click)="onExploreGamesClick()">
      <img src="/assets/icons/explore_games.png" class="w-auto h-24 object-contain rounded-xl" alt="Explore Games" />
      <span>Explore Games</span>
     </button>
    </div>
    <div class="col-span-2 flex flex-wrap gap-10 mt-4">
     <button
      class="flex flex-col items-center gap-2 border border-gray-100 text-[#2703a9] font-semibold px-8 py-4 rounded-lg hover:bg-[#6ccef9] transition-all duration-300"
      (click)="onSpinnerClick()">
      <img src="/assets/icons/spinner_enjoy.png" class="w-auto h-24 object-contain rounded-xl" alt="Spinner & Enjoy" />
      <span>Spinner & Enjoy</span>
     </button>
     <button
      class="flex flex-col items-center gap-2 border border-gray-100 text-[#2703a9] font-semibold px-8 py-4 rounded-lg hover:bg-[#6ccef9] transition-all duration-300"
      (click)="onSlamBookClick()">
      <img src="/assets/icons/slam_book.png" class="w-auto h-24 object-contain rounded-xl" alt="Slam Book" />
      <span>Slam Book</span>
     </button>
    </div>
   </div>
  </div>
 </div>
</body>

</html>
