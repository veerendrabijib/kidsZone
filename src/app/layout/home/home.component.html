<!DOCTYPE html>
<html lang="en">

<body class="relative flex min-h-screen items-center justify-center overflow-x-hidden p-6">

    <!-- Background Gradient Blobs -->
    <div class="pointer-events-none absolute inset-0 z-0">
        <div class="absolute left-[20%] top-[40%] h-75 w-75 rounded-full bg-pink-300/20 blur-3xl">
        </div>

        <div class="absolute right-[10%] top-[70%] h-87.5 w-87.5 rounded-full bg-sky-300/20 blur-3xl">
        </div>

        <div class="absolute left-[40%] bottom-[5%] h-75 w-75 rounded-full bg-green-300/20 blur-3xl">
        </div>
    </div>

    <!-- Floating Bubbles -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">

        <div
            class="absolute left-[5%] top-[80%] h-17.5 w-17.5 rounded-full bg-[#FFDD99]/50 shadow-lg animate-[floatBubble_14s_ease-in-out_infinite]">
        </div>

        <div
            class="absolute left-[85%] top-[20%] h-10 w-10 rounded-full bg-[#FFB3BA]/60 shadow-lg animate-[floatBubble_18s_ease-in-out_infinite]">
        </div>

        <div
            class="absolute left-[15%] top-[10%] h-22.5 w-22.5 rounded-full bg-[#B5EAD7]/40 shadow-lg animate-[floatBubble_20s_ease-in-out_infinite]">
        </div>

        <div
            class="absolute left-[70%] top-[75%] h-13.75 w-13.75 rounded-full bg-[#FFDAC1]/60 shadow-lg animate-[floatBubble_11s_ease-in-out_infinite]">
        </div>

        <div
            class="absolute left-[45%] top-[40%] h-7.5 w-7.5 rounded-full bg-[#E0BBE4]/70 shadow-lg animate-[floatBubble_9s_ease-in-out_infinite]">
        </div>

        <div
            class="absolute left-[60%] top-[85%] h-27.5 w-27.5 rounded-full bg-[#A0E7E5]/30 shadow-lg animate-[floatBubble_25s_ease-in-out_infinite]">
        </div>

        <div
            class="absolute left-[92%] top-[55%] h-12.5 w-12.5 rounded-full bg-[#FFC8A2]/60 shadow-lg animate-[floatBubble_16s_ease-in-out_infinite]">
        </div>

        <div
            class="absolute left-[8%] top-[45%] h-11.25 w-11.25 rounded-full bg-[#F9F3B0]/70 shadow-lg animate-[floatBubble_13s_ease-in-out_infinite]">
        </div>

        <div
            class="absolute left-[50%] top-[10%] h-18.75 w-18.75 rounded-full bg-[#FFB7B2]/50 shadow-lg animate-[floatBubble_22s_ease-in-out_infinite]">
        </div>

        <div
            class="absolute left-[28%] top-[92%] h-8.75 w-8.75 rounded-full bg-[#C7E9FB]/80 shadow-lg animate-[floatBubble_10s_ease-in-out_infinite]">
        </div>
    </div>

    <!-- Main Card -->
    <div
        class="relative z-10 w-full max-w-212.5 rounded-[72px] border-[3px] border-yellow-200/80 bg-[rgb(38,47,52)]/95 p-8 text-center shadow-[0_30px_40px_rgba(0,0,0,0.2),0_12px_18px_rgba(0,0,0,0.1)] backdrop-blur-sm transition-transform duration-300 hover:scale-[1.01] md:p-10">
        <!-- Top Decoration -->
        <div class="absolute -top-5 left-5 text-4xl">
            🌈
        </div>

        <!-- Bottom Decoration -->
        <div class="absolute -bottom-4 right-6 text-3xl">
            🧸⭐🎨
        </div>

        <!-- Heading -->
        <h3
            class="mb-3 bg-linear-to-r from-[#FF6B6B] via-[#F9D56E] via-[#A7E0E0] to-[#FFB347] bg-clip-text text-[20px] font-semibold text-transparent md:text-[24px]">
            Hi {{name}}, Welcome to
            <span class="bg-linear-to-r from-[#ebc794] to-[#8adec4] bg-clip-text font-bold text-transparent">
                Kids Zone
            </span>

        </h3>

        <!-- Description -->
        <p
            class="mx-auto my-6 rounded-[60px] bg-yellow-100/80 px-6 py-4 text-sm font-medium leading-6 text-[#3b2a1f] shadow-inner backdrop-blur-sm md:text-base">
            🌟 Learn, Play, Imagine and Grow with fun activities,
            <br>
            colorful games and creative adventures. 🎨🚀
        </p>

        <!-- Buttons -->
        <div class="mt-5 flex flex-wrap justify-center gap-4">
            <!-- Start Learning -->
            <button
                class="flex items-center gap-2 rounded-full bg-[#F9B43A] px-6 py-4 text-lg font-bold text-[#2C2B2A] shadow-[0_8px_0_#CD7A1F] transition-all duration-200 hover:-translate-y-1 hover:scale-105 active:translate-y-1">
                📚 Start Learning
            </button>
            <!-- Explore Games -->
            <button
                class="flex items-center gap-2 rounded-full bg-[#77B5FE] px-6 py-4 text-lg font-bold text-[#152A3E] shadow-[0_8px_0_#4279b3] transition-all duration-200 hover:-translate-y-1 hover:scale-105 active:translate-y-1">
                🎮 Explore Games
            </button>
            <!-- Spin & Enjoy -->
            <button
                class="flex items-center gap-2 rounded-full bg-linear-to-r from-[#a04df2] to-[#ad71ed] px-6 py-4 text-lg font-bold text-white shadow-[0_8px_0_#8c4bd1] transition-all duration-200 hover:-translate-y-1 hover:scale-105 active:translate-y-1">
                🎡 Spin & Enjoy
            </button>
            <!-- Slam Book -->
            <button
                class="flex items-center gap-2 rounded-full bg-[#D96C6C] px-6 py-4 text-lg font-bold text-[#FFF2E6] shadow-[0_8px_0_#9B3E3E] transition-all duration-200 hover:-translate-y-1 hover:scale-105 active:translate-y-1">
                📖 Slam Book
            </button>
        </div>
    </div>
</body>

</html>
